<table cellpadding="0" cellspacing="0" border="0" style="font-family:Arial,Helvetica,sans-serif;font-size:13px;line-height:1.45;color:#333333;margin-top:16px;">
  <tr>
    <td style="padding-bottom:8px;">
      Mit freundlichen Grüßen<br>
      <strong style="font-size:14px;color:#111111;">{{DisplayName}}</strong>{{#Title}}<br>
      <span style="color:#666666;">{{Title}}</span>{{/Title}}
    </td>
  </tr>
  <tr>
    <td style="padding-top:8px;border-top:2px solid #0b5cad;font-size:12px;color:#555555;">
      <strong style="color:#0b5cad;">{{Company}}</strong><br>
      {{Street}} · {{City}}<br>
      Tel. {{Phone}}{{#Mobile}} · Mobil {{Mobile}}{{/Mobile}}<br>
      <a href="mailto:{{Email}}" style="color:#0b5cad;text-decoration:none;">{{Email}}</a> · <a href="https://{{Website}}" style="color:#0b5cad;text-decoration:none;">{{Website}}</a>
    </td>
  </tr>
  <tr>
    <td style="padding-top:8px;font-size:10px;color:#999999;">{{Legal}}</td>
  </tr>
</table>
