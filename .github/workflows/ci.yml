name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit:
    name: Plugin unit tests (LuaJIT)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install lupa
      - run: python tests/test_signature.py

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install ruff
      - name: shellcheck
        run: shellcheck -S warning install.sh tests/*.sh
      - name: ruff
        run: ruff check data/signature-ui/app.py tools/ tests/
      - name: Lua syntax
        run: |
          sudo apt-get install -y -qq luajit >/dev/null
          luajit -bl data/conf/rspamd/custom/mailcow_signature.lua > /dev/null
          luajit -bl data/conf/rspamd/local.d/rspamd.lua > /dev/null
      - name: JSON files
        run: |
          for f in $(git ls-files '*.json'); do python -m json.tool "$f" > /dev/null || exit 1; done

  webui:
    name: Web UI build (React)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: webui/package-lock.json
      - run: npm ci
        working-directory: webui
      - run: npm run build
        working-directory: webui
      - name: Committed build is up to date
        run: |
          git status --porcelain data/signature-ui/dist
          test -z "$(git status --porcelain data/signature-ui/dist)" || { echo "::error::data/signature-ui/dist is outdated – run 'npm run build' in webui/ and commit"; exit 1; }

  installer:
    name: Installer (fake mailcow)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install pyyaml
      - run: bash tests/installer_test.sh

  rspamd:
    name: rspamd integration (${{ matrix.image }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        image: ["rspamd/rspamd:latest"]
    steps:
      - uses: actions/checkout@v5
      - run: docker pull ${{ matrix.image }}
      - run: bash tests/rspamd_integration.sh
        env:
          RSPAMD_IMAGE: ${{ matrix.image }}
