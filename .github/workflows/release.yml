name: Release

# Ein Tag "vX.Y.Z" erzeugt ein GitHub-Release mit den Notizen aus CHANGELOG.md und einem Archiv.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Check version
        run: |
          v="${GITHUB_REF_NAME#v}"
          file="$(cat data/signature-ui/VERSION)"
          [ "$v" = "$file" ] || { echo "::error::Tag $GITHUB_REF_NAME does not match data/signature-ui/VERSION ($file)"; exit 1; }

      - name: Release notes from CHANGELOG.md
        run: |
          v="${GITHUB_REF_NAME#v}"
          awk -v v="$v" '/^## \[/{p = index($0, "[" v "]") > 0; next} /^\[[0-9]/{p = 0} p' CHANGELOG.md > notes.md
          {
            echo
            echo "### Install / update"
            echo
            echo '```bash'
            echo "curl -fsSL https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/${GITHUB_REF_NAME}/install.sh | sudo bash -s -- --ref ${GITHUB_REF_NAME}"
            echo '```'
          } >> notes.md
          cat notes.md

      - name: Archive
        run: git archive --format=tar.gz --prefix="mailcow-signature-${GITHUB_REF_NAME}/" -o "mailcow-signature-${GITHUB_REF_NAME}.tar.gz" HEAD

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --title "mailcow-signature $GITHUB_REF_NAME" --notes-file notes.md "mailcow-signature-${GITHUB_REF_NAME}.tar.gz"
